name: Deploy to GitHub Pages

# Runs only when started by hand from the Actions tab. GitHub Pages needs a
# public repository on the free plan; until then this workflow will fail at
# the "Configure Pages" step.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pages serves the site from /ionic-weather/, not from the root.
      - run: npm run build -- --base-href /ionic-weather/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
